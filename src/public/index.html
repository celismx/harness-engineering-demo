<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tiendita</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="banner-ambiente">STAGING · datos de prueba</div>

    <header class="barra">
      <h1 class="marca">Tiendita</h1>
      <button id="btn-carrito" class="secundario" hidden>🛒 Carrito (<span id="contador">0</span>)</button>
    </header>

    <main>
      <section id="pantalla-login" class="tarjeta">
        <h2>Iniciar sesión</h2>
        <form id="form-login">
          <label>Correo <input name="correo" type="email" value="ana@tiendita.demo" /></label>
          <label>Contraseña <input name="password" type="password" /></label>
          <button type="submit">Entrar</button>
          <p class="error" id="error-login"></p>
        </form>
      </section>

      <section id="pantalla-catalogo" hidden>
        <p>Hola, <strong id="nombre-usuario"></strong>. Envío gratis en compras desde $1,000.</p>
        <div class="catalogo" id="catalogo"></div>
      </section>

      <section id="pantalla-carrito" class="tarjeta" hidden>
        <h2>Tu carrito</h2>
        <table class="lineas">
          <thead>
            <tr><th>Producto</th><th>Precio</th><th>Cantidad</th><th>Subtotal</th><th></th></tr>
          </thead>
          <tbody id="lineas"></tbody>
        </table>

        <form id="form-cupon" class="cupon">
          <label>Cupón <input name="codigo" placeholder="BIENVENIDA100" /></label>
          <button type="submit" class="secundario">Aplicar</button>
        </form>
        <p class="error" id="error-cupon"></p>

        <dl class="resumen">
          <dt>Subtotal</dt><dd id="res-subtotal"></dd>
          <dt id="res-cupon-etiqueta">Cupón</dt><dd id="res-cupon"></dd>
          <dt>Envío</dt><dd id="res-envio"></dd>
          <dt>IVA (16%)</dt><dd id="res-iva"></dd>
          <dt class="total">Total</dt><dd id="res-total" class="total"></dd>
        </dl>

        <label>Enviar a <select id="direccion"></select></label>
        <div class="acciones">
          <button id="btn-pagar">Pagar</button>
          <button id="btn-seguir" class="secundario">Seguir comprando</button>
        </div>
        <p class="error" id="error-pagar"></p>
      </section>

      <section id="pantalla-confirmacion" class="tarjeta" hidden>
        <h2>¡Gracias por tu compra!</h2>
        <dl class="resumen">
          <dt>Pedido</dt><dd id="conf-numero"></dd>
          <dt>Enviamos a</dt><dd id="conf-direccion"></dd>
          <dt>Productos</dt><dd id="conf-productos"></dd>
          <dt class="total">Total cobrado</dt><dd id="conf-total" class="total"></dd>
        </dl>
        <button id="btn-volver">Seguir comprando</button>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
